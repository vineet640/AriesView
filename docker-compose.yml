services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.8
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure

  # Azure Blob Storage emulator -- the ingestion service talks to this via
  # the real azure-storage-blob SDK. Swap AZURE_STORAGE_CONNECTION_STRING to
  # a real Storage Account to run against production Azure; no code changes.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.32.0
    # --skipApiVersionCheck: the pinned image predates the storage API
    # version the current azure-storage-blob SDK sends by default; this is
    # Azurite's documented flag for that skew (harmless for local dev).
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    restart: on-failure

volumes:
  weaviate_data:
  azurite_data:
