name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest numpy
      - name: Run chunker unit tests
        run: pytest tests/ -v

  js-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 25 -- matches local dev, and is why the test script's
          # NODE_OPTIONS=--localstorage-file fix (see ISSUES_AND_DEBUGGING.md)
          # is needed at all; it isn't a valid NODE_OPTIONS flag on Node 20.
          node-version: "25"
          cache: "npm"
          cache-dependency-path: services/api-gateway/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run gateway unit tests
        run: npm test
